{% extends "base.html" %}
{% block content %}
<div class="row">
    <div class="col-md-3">
        <h3>分類</h3>
        <ul class="list-group">
            <li class="list-group-item {% if not category %}active{% endif %}">
                <a href="{% url 'shop:product_list' %}" class="text-decoration-none">全部</a>
            </li>
            {% for c in categories %}
            <li class="list-group-item {% if category.slug == c.slug %}active{% endif %}">
                <a href="{{ c.get_absolute_url }}" class="text-decoration-none">{{ c.name }}</a>
            </li>
            {% endfor %}
        </ul>
    </div>
    <div class="col-md-9">
        <h2>{% if category %}{{ category.name }}{% else %}所有商品{% endif %}</h2>
        <div class="row">
            {% for product in products %}
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">{{ product.name }}</h5>
                        <p class="card-text">${{ product.price }}</p>
                        <a href="{{ product.get_absolute_url }}" class="btn btn-primary">查看詳情</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
