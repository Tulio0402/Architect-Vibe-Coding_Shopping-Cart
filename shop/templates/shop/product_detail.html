{% extends "base.html" %}
{% block content %}
<div class="row">
    <div class="col-md-6">
        <img src="{{ product.image_url|default:'https://via.placeholder.com/400' }}" class="img-fluid">
    </div>
    <div class="col-md-6">
        <h1>{{ product.name }}</h1>
        <h2 class="text-danger">${{ product.price }}</h2>
        <p>{{ product.description }}</p>
        <form action="{% url 'cart:cart_add' product.id %}" method="post">
            {% csrf_token %}
            {{ cart_product_form.as_p }}
            <input type="submit" value="加入購物車" class="btn btn-success">
        </form>
    </div>
</div>
{% endblock %}
